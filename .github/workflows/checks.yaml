name: Checks
on:
  pull_request
jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    env:
      # Google Chrome ships with the ubuntu-latest runner image.
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: yarn
      - run: yarn add node-forge -P
      - run: yarn test
